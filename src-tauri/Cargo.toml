[package]
name = "iyagi-layout-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "IYAGI Layout — Tauri shell: tray, global shortcuts, settings window, lifecycle."

[lib]
name = "iyagi_layout_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-opener = "2.7.0"
layout-core = { workspace = true }
layout-macos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
